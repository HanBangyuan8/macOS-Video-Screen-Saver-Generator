name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  three-pass-validation:
    name: macOS three-pass validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n build.command diagnose.command Scripts/*.sh

      - name: Build and run validation suite
        run: |
          VIDEO_SCREEN_SAVER_VERSION=1.0.4 \
          VIDEO_SCREEN_SAVER_BUILD_VERSION=5 \
          VIDEO_SAVER_BUILD_OUTPUT=/tmp/video-screen-saver-generator-ci \
          ./build.command --no-open --non-interactive
